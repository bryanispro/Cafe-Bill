<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Bill Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-weight: bold;
    }

    .price {
      color: #666;
      font-size: 14px;
      margin-top: 3px;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quantity-input {
      width: 55px;
      height: 34px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
      text-align: center;
      font-size: 16px;
    }

    .quantity-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .minus {
      background: #dc3545;
    }

    .minus:hover {
      background: #b02a37;
    }

    .plus {
      background: #28a745;
    }

    .plus:hover {
      background: #218838;
    }

    .calculate-btn {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .calculate-btn:hover {
      background: #555;
    }

    #result {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px solid #333;
      font-size: 22px;
      font-weight: bold;
      text-align: right;
    }

    #status {
      text-align: center;
      color: #666;
      padding: 20px 0;
    }

    .error {
      color: #dc3545 !important;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Café Bill Calculator</h1>

    <div id="status">Loading menu...</div>

    <div id="menu"></div>

    <button
      id="calculateButton"
      class="calculate-btn"
      onclick="calculateBill()"
      disabled
    >
      Calculate Bill
    </button>

    <div id="result">
      Total: $0.00
    </div>
  </div>

  <script>
    let menuItems = [];

    async function loadMenu() {
      const status = document.getElementById("status");
      const calculateButton = document.getElementById("calculateButton");

      try {
        const response = await fetch("menu.csv");

        if (!response.ok) {
          throw new Error("Could not load menu.csv");
        }

        const csvText = await response.text();
        menuItems = parseCSV(csvText);

        if (menuItems.length === 0) {
          throw new Error("No valid menu items found.");
        }

        renderMenu();

        status.style.display = "none";
        calculateButton.disabled = false;

      } catch (error) {
        status.textContent =
          "Unable to load the menu. Make sure menu.csv is in the same folder as index.html.";
        status.classList.add("error");

        console.error(error);
      }
    }

    function parseCSV(csvText) {
      const lines = csvText
        .trim()
        .split(/\r?\n/)
        .filter(line => line.trim() !== "");

      if (lines.length < 2) {
        return [];
      }

      const items = [];

      // Skip the first row because it contains the headers.
      for (let i = 1; i < lines.length; i++) {
        const columns = lines[i].split(",");

        if (columns.length < 2) {
          continue;
        }

        const name = columns[0].trim();
        const price = parseFloat(columns[1].trim());

        if (name && Number.isFinite(price)) {
          items.push({
            name: name,
            price: price
          });
        }
      }

      return items;
    }

    function renderMenu() {
      const menuContainer = document.getElementById("menu");
      menuContainer.innerHTML = "";

      menuItems.forEach((item, index) => {
        const itemId = "item-" + index;

        const itemElement = document.createElement("div");
        itemElement.className = "item";

        itemElement.innerHTML = `
          <div class="item-info">
            <div class="item-name">${escapeHTML(item.name)}</div>
            <div class="price">$${item.price.toFixed(2)}</div>
          </div>

          <div class="quantity-control">
            <button
              class="quantity-btn minus"
              onclick="changeQuantity('${itemId}', -1)"
            >
              −
            </button>

            <input
              class="quantity-input"
              type="number"
              id="${itemId}"
              min="0"
              step="1"
              value="0"
            >

            <button
              class="quantity-btn plus"
              onclick="changeQuantity('${itemId}', 1)"
            >
              +
            </button>
          </div>
        `;

        menuContainer.appendChild(itemElement);
      });
    }

    function changeQuantity(id, change) {
      const input = document.getElementById(id);

      let quantity = parseInt(input.value, 10);

      if (isNaN(quantity)) {
        quantity = 0;
      }

      quantity += change;

      if (quantity < 0) {
        quantity = 0;
      }

      input.value = quantity;
    }

    function getQuantity(id) {
      const input = document.getElementById(id);
      let value = parseInt(input.value, 10);

      if (!Number.isFinite(value) || value < 0) {
        value = 0;
      }

      return value;
    }

    function calculateBill() {
      let total = 0;

      menuItems.forEach((item, index) => {
        const quantity = getQuantity("item-" + index);
        total += quantity * item.price;
      });

      document.getElementById("result").textContent =
        "Total: $" + total.toFixed(2);
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    loadMenu();
  </script>

</body>
</html>
