<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Bill Calculator</title>

  <style>
    :root {
      color-scheme: light dark;

      --bg: #f5f5f5;
      --card-bg: #ffffff;
      --text: #222222;
      --muted-text: #666666;
      --border: #eeeeee;
      --input-border: #cccccc;
      --button-bg: #333333;
      --button-hover: #555555;
      --result-border: #333333;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --card-bg: #1e1e1e;
        --text: #f2f2f2;
        --muted-text: #b0b0b0;
        --border: #333333;
        --input-border: #555555;
        --button-bg: #444444;
        --button-hover: #5a5a5a;
        --result-border: #777777;
      }
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-weight: bold;
    }

    .price {
      color: var(--muted-text);
      font-size: 14px;
      margin-top: 3px;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quantity-input {
      width: 55px;
      height: 36px;
      box-sizing: border-box;
      border: 1px solid var(--input-border);
      border-radius: 5px;
      text-align: center;
      font-size: 16px;
      background: var(--card-bg);
      color: var(--text);
    }

    .quantity-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .minus {
      background: #dc3545;
    }

    .minus:hover {
      background: #b02a37;
    }

    .plus {
      background: #28a745;
    }

    .plus:hover {
      background: #218838;
    }

    .calculate-btn {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: var(--button-bg);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .calculate-btn:hover {
      background: var(--button-hover);
    }

    .calculate-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #result {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px solid var(--result-border);
      font-size: 22px;
      font-weight: bold;
      text-align: right;
    }

    #status {
      text-align: center;
      color: var(--muted-text);
      padding: 20px 0;
    }

    .error {
      color: #dc3545 !important;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Café Bill Calculator</h1>

    <div id="status">
      Loading menu...
    </div>

    <div id="menu"></div>

    <button
      id="calculateButton"
      class="calculate-btn"
      onclick="calculateBill()"
      disabled
    >
      Calculate Bill
    </button>

    <div id="result">
      Total: $0.00
    </div>

  </div>

  <script>
    let menuItems = [];

    // Load menu items from menu.csv
    async function loadMenu() {
      const status = document.getElementById("status");
      const calculateButton =
        document.getElementById("calculateButton");

      try {

        // cache: "no-store" helps prevent an old menu.csv
        // from being loaded from the browser cache.
        const response = await fetch(
          "menu.csv",
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("Could not load menu.csv");
        }

        const csvText = await response.text();

        menuItems = parseCSV(csvText);

        if (menuItems.length === 0) {
          throw new Error("No valid menu items found.");
        }

        renderMenu();

        status.style.display = "none";
        calculateButton.disabled = false;

      } catch (error) {

        status.textContent =
          "Unable to load the menu. Make sure menu.csv is in the same folder as index.html.";

        status.classList.add("error");

        console.error(error);
      }
    }


    // Convert CSV text into menu item objects
    function parseCSV(csvText) {

      const lines = csvText
        .trim()
        .split(/\r?\n/)
        .filter(line => line.trim() !== "");

      if (lines.length < 2) {
        return [];
      }

      const items = [];

      // Start at row 1 to skip the CSV header
      for (let i = 1; i < lines.length; i++) {

        const columns = lines[i].split(",");

        if (columns.length < 2) {
          continue;
        }

        const name = columns[0].trim();
        const price = parseFloat(columns[1].trim());

        if (name && Number.isFinite(price)) {

          items.push({
            name: name,
            price: price
          });

        }
      }

      return items;
    }


    // Create the menu interface
    function renderMenu() {

      const menuContainer =
        document.getElementById("menu");

      menuContainer.innerHTML = "";

      menuItems.forEach((item, index) => {

        const itemId = "item-" + index;

        const itemElement =
          document.createElement("div");

        itemElement.className = "item";

        itemElement.innerHTML = `
          <div class="item-info">

            <div class="item-name">
              ${escapeHTML(item.name)}
            </div>

            <div class="price">
              $${item.price.toFixed(2)}
            </div>

          </div>

          <div class="quantity-control">

            <button
              class="quantity-btn minus"
              onclick="changeQuantity('${itemId}', -1)"
              aria-label="Decrease ${escapeHTML(item.name)} quantity"
            >
              −
            </button>

            <input
              class="quantity-input"
              type="number"
              id="${itemId}"
              min="0"
              step="1"
              value="0"
              aria-label="${escapeHTML(item.name)} quantity"
            >

            <button
              class="quantity-btn plus"
              onclick="changeQuantity('${itemId}', 1)"
              aria-label="Increase ${escapeHTML(item.name)} quantity"
            >
              +
            </button>

          </div>
        `;

        menuContainer.appendChild(itemElement);

      });
    }


    // Increase or decrease quantity
    function changeQuantity(id, change) {

      const input =
        document.getElementById(id);

      let quantity =
        parseInt(input.value, 10);

      if (isNaN(quantity)) {
        quantity = 0;
      }

      quantity += change;

      if (quantity < 0) {
        quantity = 0;
      }

      input.value = quantity;
    }


    // Read quantity entered by the user
    function getQuantity(id) {

      const input =
        document.getElementById(id);

      let value =
        parseInt(input.value, 10);

      if (!Number.isFinite(value) || value < 0) {
        value = 0;
      }

      return value;
    }


    // Calculate the total bill
    function calculateBill() {

      let total = 0;

      menuItems.forEach((item, index) => {

        const quantity =
          getQuantity("item-" + index);

        total +=
          quantity * item.price;

      });

      document.getElementById("result").textContent =
        "Total: $" + total.toFixed(2);
    }


    // Safely display text from the CSV
    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }


    // Load menu when page opens
    loadMenu();

  </script>

</body>
</html>
